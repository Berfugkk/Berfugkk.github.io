<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dicionário</title>
</head>
<body>
  <script>
    (function () {
      // GitHub Pages does not natively rewrite SPA routes. Preserve the requested
      // path after the repository root and let the application read it from hash.
      var path = location.pathname.replace(/^\/+/, '');
      var parts = path.split('/').filter(Boolean);
      var first = parts[0] || '';
      var isUserSiteRoute = ['palavras', 'categoria', 'sobre'].indexOf(first) !== -1;
      var root = isUserSiteRoute ? '/' : (parts.length > 1 ? '/' + first + '/' : '/');
      var rest = isUserSiteRoute ? parts.join('/') : (parts.length > 1 ? parts.slice(1).join('/') : '');
      if (rest) {
        location.replace(location.origin + root + '#/' + rest + location.search);
      } else {
        location.replace(location.origin + root);
      }
    })();
  </script>
</body>
</html>
